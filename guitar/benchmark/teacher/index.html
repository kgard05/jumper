l:var(--muted);font-family:system-ui,sans-serif;font-size:12px}.chord-picture .string-mark{font-size:17px;fill:var(--ink)}.chord-picture .fret-line{stroke:#81909a;stroke-width:1}.chord-picture .nut-line{stroke:var(--navy);stroke-width:4}.recognition-card select{font-size:.85rem;padding-left:8px;padding-right:4px}.builder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.builder-card{border:1px solid var(--line);background:#fcfdfe;border-radius:12px;padding:18px}.builder-card h3{font-size:1.25rem;font-weight:500}.builder-card p{color:var(--muted);font-size:.8rem;margin:0 0 14px}.diagram-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));text-align:center;isolation:isolate}.builder-string{font-size:.77rem;font-weight:700;color:var(--muted);padding-bottom:5px}.diagram-grid button{border:1px solid #aebcc6;border-right:0;border-bottom:0;background:#fff;min-width:0;min-height:44px;padding:0;color:var(--ink);position:relative}.diagram-grid button:nth-child(6n){border-right:1px solid #aebcc6}.mark-button{font-weight:750;font-size:1rem;border-bottom:3px solid var(--navy)!important}.mark-button.active{background:#e2ebf2}.fret-button{font-size:1.3rem}.fret-button::before{content:"";height:100%;width:1px;background:#bec9d0;position:absolute;top:0;left:50%;z-index:-1}.diagram-grid button.active{background:var(--navy);color:white}.diagram-grid button:hover{background:#e5edf3;color:var(--ink)}.diagram-grid button:focus-visible{z-index:2}.diagram-grid button:nth-last-child(-n+6){border-bottom:1px solid #aebcc6}.fret-caption{font-size:.72rem;color:var(--muted);text-align:center;margin-top:7px}.builder-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.clear-builder{border:0;padding:4px 0;background:none;text-decoration:underline;font-size:.75rem;color:var(--muted);text-underline-offset:3px}.selection-summary{font-size:.75rem;color:var(--muted)}.choice-question{border-bottom:1px solid #e3e8ec;padding:18px 0 23px :10px;padding:15px}.teacher-chord p{font-size:.85rem;margin:6px 0}.teacher-chord svg{display:block}.string-answers{width:100%;border-collapse:collapse;font-size:.8rem;margin:10px 0 20px}.string-answers th,.string-answers td{border:1px solid var(--line);padding:7px;text-align:center}details>summary{cursor:pointer;font-weight:700}.text-input{margin-bottom:5px}.teacher-note-label{display:block;margin:20px 0 7px;font-size:.9rem;font-weight:650}

</style></head><body><header><div class="brand"><span class="brand-mark" aria-hidden="true">G</span>Gardner Classroom · Teacher</div><a class="home-link" href="../">Student benchmark</a></header><main id="app"><div class="login-card">Loading teacher dashboard…</div></main><footer>Guitar Chord Benchmark · Private teacher results</footer><script>
'use strict';
const CHORDS=[{name:'Small C',shape:'xxx010'},{name:'Small G',shape:'xxx003'},{name:'Small G7',shape:'xxx001'},{name:'Em',shape:'022000'},{name:'D',shape:'xx0232'},{name:'C',shape:'x32010'},{name:'G',shape:'320003'},{name:'A',shape:'x02220'},{name:'A7',shape:'x02020'},{name:'Am',shape:'x02210'},{name:'D7',shape:'xx0212'},{name:'E',shape:'022100'}];
const BUILD_CHORDS=['C','G','D','Am'];
const STRINGS=['E','A','D','G','B','E'];
const STRING_LABELS=['low E (6th)','A (5th)','D (4th)','G (3rd)','B (2nd)','high e (1st)'];
const SYMBOLS=[{label:'X above a string',choices:[['skip','Do not strum it'],['open','Play it open'],['press','Press a fret']]},{label:'O above a string',choices:[['open','Play it open'],['skip','Do not strum it'],['nut','The nut']]},{label:'Dot on a fret',choices:[['press','Press that string at that fret'],['open','Play it open'],['skip','Do not strum it']]},{label:'Thick line at the top',choices:[['nut','The nut before fret 1'],['press','A finger position'],['open','An open string']]}];
const KNOWLEDGE=[{prompt:'What is a chord?',options:['Three or more notes sounding together','One string played repeatedly','The wooden part of the guitar'],answer:0},{prompt:'For a full C chord, which string should you avoid strumming?',options:['Low E (6th)','G (3rd)','High e (1st)'],answer:0},{prompt:'What does a capo do?',options:['Shortens the strings to raise the pitch','Tunes each string separately','Mutes every string'],answer:0},{prompt:'What helps fretted notes ring clearly?',options:['Curled fingers and a relaxed wrist','A flat finger across every string','A tightly bent wrist'],answer:0}];
const APPLY=[{prompt:'In G | D | Em | C repeated, what comes after C?',options:['G','D','Am'],answer:0},{prompt:'Four measures with four downstrokes each contain how many strums?',options:['8','12','16'],answer:2},{prompt:'Which two chords have the same root letter?',options:['G and G7','G and D','Em and Am'],answer:0},{prompt:'When using a capo, where does fret 1 move?',options:['Just after the capo','Back to the nut','It disappears from the chart'],answer:0}];
const PLAYING=[{key:'position',label:'Playing position and fretting hand',max:3},{key:'C',label:'Clear C chord',max:2},{key:'G',label:'Clear G chord',max:2},{key:'D',label:'Clear D chord',max:2},{key:'Em',label:'Clear Em chord',max:2},{key:'Am',label:'Clear Am chord',max:2},{key:'G-D',label:'Change G to D',max:3},{key:'D-Em',label:'Change D to Em',max:3},{key:'Em-C',label:'Change Em to C',max:3},{key:'C-G',label:'Change C to G',max:3},{key:'pulse',label:'Steady four-beat strumming',max:5}];
const SECTIONS=['Strings & symbols','Name the chords','Build the chords','Chord knowledge','Review & submit'];
const POINTS=[14,24,16,16,0];
const SCORE_ROWS=[['strings','Open strings',6],['symbols','Diagram symbols',8],['names','Name the chords',24],['diagrams','Build the chords',16],['knowledge','Playing chords',8],['apply','Put it together',8]];
function esc(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chordSVG(shape){let content='';'EADGBe'.split('').forEach((s,i)=>{const x=22+i*22;content+=`<text x="${x}" y="13" text-anchor="middle">${s}</text><line x1="${x}" x2="${x}" y1="32" y2="140" class="fret-line"/>`});content+='<line x1="22" x2="132" y1="32" y2="32" class="nut-line"/>';for(let f=1;f<=4;f++)content+=`<line x1="22" x2="132" y1="${32+f*27}" y2="${32+f*27}" class="fret-line"/>`;shape.split('').forEach((v,i)=>{const x=22+i*22;content+=['x','0'].includes(v)?`<text x="${x}" y="27" text-anchor="middle" class="string-mark">${v==='x'?'×':'○'}</text>`:`<circle cx="${x}" cy="${32+(Number(v)-.5)*27}" r="7" fill="currentColor"/>`});const words=shape.split('').map((v,i)=>`${STRING_LABELS[i]}: ${v==='x'?'muted':v==='0'?'open':'fret '+v}`).join('; ');return `<svg class="chord-picture" viewBox="0 0 154 158" role="img" aria-label="Chord diagram. ${esc(words)}">${content}</svg>`}

const API='https://api.gardnerclassroom.com/api';
let records=[],selected=null,filter='',dirty=false;
async function api(path,options={}){const response=await fetch(API+path,{...options,credentials:'include',headers:{'Content-Type':'application/json',...options.headers},signal:AbortSignal.timeout(20000)});const data=await response.json();if(!response.ok){const error=new Error(data.error||'Could not load results.');error.status=response.status;throw error}return data}
function login(message=''){document.getElementById('app').innerHTML=`<section class="login-card"><span class="eyebrow">Private teacher access</span><h1>Teacher results</h1><p>Sign in to view saved answers and score the playing check.</p><form id="login-form"><label for="teacher-password">Teacher password</label><input class="text-input" id="teacher-password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button class="btn" type="submit">Sign in</button></form><p id="login-status" class="error" role="status">${esc(message)}</p></section>`}
async function loadRecords(){records=[];let offset=0;do{const result=await api('/teacher/submissions?offset='+offset);records.push(...result.submissions);offset=result.nextOffset}while(offset!==null);render()}
function render(){document.getElementById('app').innerHTML=`<div class="toolbar"><h1>Guitar benchmark results</h1><button class="btn outline" id="refresh">Refresh</button><button class="btn outline" id="export">Export CSV</button><button class="btn outline" id="logout">Sign out</button></div><div class="teacher-layout"><aside class="teacher-list"><label class="name-label" for="search">Find a student</label><input class="text-input" id="search" type="search" value="${esc(filter)}" placeholder="Search names"><p class="status">${records.length} saved submission${records.length===1?'':'s'}</p><div class="student-list" id="student-list">${listHTML()}</div></aside><article class="teacher-detail" id="detail">${selected?detailHTML():'<h2>Choose a student</h2><p class="status">Saved student answers and the playing rubric appear here.</p>'}</article></div>`}
function listHTML(){const found=records.filter(r=>r.student_name.toLowerCase().includes(filter.toLowerCase()));return found.length?found.map(r=>`<button class="student-button" data-student="${r.id}" aria-current="${selected?.id===r.id}"><b>${esc(r.student_name)}</b><small>${esc(new Date(r.submitted_at).toLocaleString())}</small><small>Knowledge ${r.written_score}/70 · Playing ${r.practical_score===null?'pending':r.practical_score+'/30'}</small></button>`).join(''):'<p class="status">No matching submissions.</p>'}
function detailHTML(){const r=selected;return`<span class="eyebrow">Submitted ${esc(new Date(r.submitted_at).toLocaleString())}</span><h1>${esc(r.student_name)}</h1><div class="total-scores"><div><strong>${r.written_score}/70</strong><span>Knowledge</span></div><div><strong id="playing-total">${r.practical_score===null?'Pending':r.practical_score+'/30'}</strong><span>Playing</span></div><div><strong id="overall-total">${r.practical_score===null?'Pending':(r.written_score+r.practical_score)+'/100'}</strong><span>Overall</span></div></div><table class="result-table"><tbody>${SCORE_ROWS.map(([key,label,max])=>`<tr><th scope="row">${label}</th><td>${r.section_scores[key]}/${max}</td></tr>`).join('')}</tbody></table><h2>Playing check · 30 points</h2><p class="rubric-help">Play C, G, D, Em, Am once each. Then G | D | Em | C twice, four steady downstrokes per measure.<br>Chords: 2 clear, 1 partly clear, 0 absent. Changes: 3 clean and on time, 2 late, 1 full stop, 0 omitted. Pulse: 5 steady, 3 some drift, 1 frequent stops, 0 absent.</p><form id="grade-form">${PLAYING.map(item=>`<div class="rubric-item"><label for="score-${item.key}">${item.label} <small>(${item.max})</small></label><select id="score-${item.key}" name="${item.key}" data-score="${item.key}" required><option value="">Score</option>${Array.from({length:item.max+1},(_,i)=>`<option value="${i}" ${r.practical_scores?.[item.key]===i?'selected':''}>${i} / ${item.max}</option>`).join('')}</select></div>`).join('')}<label for="teacher-note" class="teacher-note-label">Teacher feedback</label><textarea class="text-input" id="teacher-note" maxlength="2000">${esc(r.teacher_note||'')}</textarea><button class="btn" type="submit">Save playing scores & note</button><p id="grade-status" class="status" role="status">${r.graded_at?'Last saved '+esc(new Date(r.graded_at).toLocaleString()):'Playing check has not been scored yet.'}</p></form><details class="answers"><summary>View student answers</summary>${answersHTML(r.answers)}</details><p class="status">Receipt: ${esc(r.id)}</p>`}
function answer(value,expected){return`<span class="${value===expected?'correct':'incorrect'}">${esc(value||'Unanswered')}</span><small>Expected: ${esc(expected)}</small>`}
function answersHTML(a){return`<h3 style="margin-top:20px">Open strings</h3>${a.strings.map((v,i)=>`<div class="answer-row">${6-i} string: ${answer(v.trim().toUpperCase(),STRINGS[i])}</div>`).join('')}<h3 style="margin-top:20px">Symbols</h3>${a.symbols.map((v,i)=>`<div class="answer-row">${SYMBOLS[i].label}: ${answer(SYMBOLS[i].choices.find(c=>c[0]===v)?.[1]||'',SYMBOLS[i].choices[0][1])}</div>`).join('')}<h3 style="margin-top:20px">Chord identification</h3><div class="teacher-diagrams">${CHORDS.map((c,i)=>`<div class="teacher-chord"><b>Diagram ${i+1}</b>${chordSVG(c.shape)}${answer(a.names[i],c.name)}</div>`).join('')}</div><h3>Built chords</h3>${BUILD_CHORDS.map(n=>`<b>${n}</b><table class="string-answers"><thead><tr><th scope="col">String</th>${'EADGBe'.split('').map(s=>`<th scope="col">${s}</th>`).join('')}</tr></thead><tbody><tr><th scope="row">Student</th>${a.diagrams[n].map(v=>`<td>${esc(v==='o'?'O':v==='x'?'X':v||'—')}</td>`).join('')}</tr><tr><th scope="row">Expected</th>${CHORDS.find(c=>c.name===n).shape.split('').map(v=>`<td>${v==='0'?'O':v==='x'?'X':v}</td>`).join('')}</tr></tbody></table>${n==='G'?'<p class="status">Four-finger G (3, 2, O, O, 3, 3) also receives full credit.</p>':''}`).join('')}<h3>Chord knowledge</h3>${KNOWLEDGE.map((q,i)=>`<div class="answer-row">${esc(q.prompt)}<br>${answer(q.options[a.knowledge[i]]||'',q.options[q.answer])}</div>`).join('')}<h3 style="margin-top:20px">Put it together</h3>${APPLY.map((q,i)=>`<div class="answer-row">${esc(q.prompt)}<br>${answer(q.options[a.apply[i]]||'',q.options[q.answer])}</div>`).join('')}`}
function showError(error){if(error.status===401){selected=null;records=[];login('Your session expired. Please sign in again.')}else{const status=document.getElementById('grade-status');if(status){status.textContent=error.message;status.className='error'}else alert(error.message)}}
function csvCell(value){let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
async function exportCSV(button){button.disabled=true;button.textContent='Exporting…';try{const rows=[['Student','Submitted','Knowledge /70','Playing /30','Overall /100',...PLAYING.map(p=>p.label),'Teacher note','Receipt','Answers JSON']];for(const record of records){const {submission:r}=await api('/teacher/submissions/'+record.id);rows.push([r.student_name,r.submitted_at,r.written_score,r.practical_score,r.practical_score===null?'':r.written_score+r.practical_score,...PLAYING.map(p=>r.practical_scores?.[p.key]??''),r.teacher_note,r.id,JSON.stringify(r.answers)])}const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='guitar-benchmark-results.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){showError(error)}finally{button.disabled=false;button.textContent='Export CSV'}}
document.getElementById('app').addEventListener('submit',async event=>{event.preventDefault();const form=event.target,button=form.querySelector('button[type=submit]');button.disabled=true;if(form.id==='login-form'){const status=document.getElementById('login-status');status.textContent='Signing in…';try{await api('/teacher/login',{method:'POST',body:JSON.stringify({password:form.elements.password.value})});form.reset();await loadRecords()}catch(error){status.textContent=error.message}finally{button.disabled=false}}else if(form.id==='grade-form'){const scores=Object.fromEntries(PLAYING.map(p=>[p.key,Number(form.elements.namedItem(p.key).value)])),note=document.getElementById('teacher-note').value;try{const result=await api('/teacher/submissions/'+selected.id,{method:'PATCH',body:JSON.stringify({scores,note})});selected={...selected,practical_scores:scores,practical_score:result.practicalScore,teacher_note:note,graded_at:result.gradedAt};Object.assign(records.find(r=>r.id===selected.id),{practical_score:result.practicalScore,graded_at:result.gradedAt});dirty=false;render();document.getElementById('grade-status').textContent='Saved playing scores and feedback.'}catch(error){showError(error)}finally{button.disabled=false}}});
document.getElementById('app').addEventListener('input',event=>{if(event.target.id==='search'){filter=event.target.value;document.getElementById('student-list').innerHTML=listHTML()}else if(event.target.id==='teacher-note'||event.target.dataset.score)dirty=true});
document.getElementById('app').addEventListener('click',async event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.student){if(dirty&&!confirm('Leave without saving these playing scores or notes?'))return;button.disabled=true;try{const result=await api('/teacher/submissions/'+button.dataset.student);selected=result.submission;dirty=false;render()}catch(error){showError(error)}finally{button.disabled=false}}if(button.id==='refresh'){if(dirty&&!confirm('Refresh without saving these playing scores or notes?'))return;try{selected=null;dirty=false;await loadRecords()}catch(error){showError(error)}}if(button.id==='export')await exportCSV(button);if(button.id==='logout'){if(dirty&&!confirm('Sign out without saving these playing scores or notes?'))return;try{await api('/teacher/logout',{method:'POST',body:'{}'});selected=null;records=[];dirty=false;login()}catch(error){showError(error)}}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
(async()=>{try{await api('/teacher/session');await loadRecords()}catch(error){login(error.status===401?'':error.name==='TypeError'?'Could not reach the results server. Please try again.':error.message)}})();
</script></body></html>
