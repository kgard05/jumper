<style>

r:1px solid var(--line);border-radius:17px;padding:48px 50px;box-shadow:0 12px 28px #102a3a05;min-width:0}.step-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.step-points{font-size:.85rem;font-weight:700;color:var(--muted)}h1{font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.2;letter-spacing:-.035em;font-weight:650;margin:20px 0 10px}h2{font-size:1.15rem;line-height:1.4;margin:0}h3{font-size:1.05rem;margin:0 0 8px}.intro{color:var(--muted);margin:0 0 30px}.name-label{font-size:.9rem;font-weight:700;display:block;margin-bottom:7px}.text-input,select{border:1px solid #bfcbd3;border-radius:7px;background:#fff;color:var(--ink);padding:11px 12px;min-height:44px;width:100%}option{background:#fff;color:var(--ink)}#student-name{max-width:480px}.question-section{margin-top:35px}.question-section p{font-size:.9rem;color:var(--muted);margin:10px 0 16px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}.section-heading span{font-size:.8rem;color:var(--muted);white-space:nowrap}.string-inputs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.string-inputs label{text-align:center;font-size:.82rem;font-weight:700;color:var(--muted)}.string-inputs input{margin-top:8px;text-align:center;font-size:1.1rem;text-transform:uppercase}.symbol-list{display:grid;gap:14px}.symbol-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center;font-size:.88rem}.recognition-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.recognition-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fcfdfe;display:flex;flex-direction:column;align-items:center}.question-number{border-radius:7px;background:var(--soft);padding:4px 8px;font-size:.8rem;font-weight:700;align-self:flex-start;display:inline-block;margin-bottom:9px}.chord-picture{width:100%;max-width:165px;height:auto;color:var(--ink);margin:0 auto 10px}.chord-picture text{fill:var(--muted);font-family:system-ui,sans-serif;font-size:12px}.chord-picture .string-mark{font-size:17px;fill:var(--ink)}.chord-picture .fret-line{stroke:#81909a;stroke-width:1}.chord-picture .nut-line{stroke:var(--navy);stroke-width:4}.recognition-card select{font-size:.85rem;padding-left:8px;padding-right:4px}.builder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.builder-card{border:1px solid var(--line);background:#fcfdfe;border-radius:12px;padding:18px}.builder-card h3{font-size:1.25rem;font-weight:500}.builder-card p{color:var(--muted);font-size:.8rem;margin:0 0 14px}.diagram-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));text-align:center;isolation:isolate}.builder-string{font-size:.77rem;font-weight:700;color:var(--muted);padding-bottom:5px}.diagram-grid button{border:1px solid #aebcc6;border-right:0;border-bottom:0;background:#fff;min-width:0;min-height:44px;padding:0;color:var(--ink);position:relative}.diagram-grid button:nth-child(6n){border-right:1px solid #aebcc6}.mark-button{font-weight:750;font-size:1rem;border-bottom:3px solid var(--navy)!important}.mark-button.active{background:#e2ebf2}.fret-button{font-size:1.3rem}.fret-button::before{content:"";height:100%;width:1px;background:#bec9d0;position:absolute;top:0;left:50%;z-index:-1}.diagram-grid button.active{background:var(--navy);color:white}.diagram-grid button:hover{background:#e5edf3;color:var(--ink)}.diagram-grid button:focus-visible{z-index:2}.diagram-grid button:nth-last-child(-n+6){border-bottom:1px solid #aebcc6}.fret-caption{font-size:.72rem;color:var(--muted);text-align:center;margin-top:7px}.builder-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.clear-builder{border:0;padding:4px 0;background:none;text-decoration:underline;font-size:.75rem;color:var(--muted);text-underline-offset:3px}.selection-summary{font-size:.75rem;color:var(--muted)}.choice-question{border-bottom:1px solid #e3e8ec;padding:18px 0 23px;margin-bottom:9px}.choice-question h3{font-weight:650}.choice-group{display:grid;gap:8px}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:.88rem;cursor:pointer}.choice:has(input:checked){background:#edf3f7;border-color:#829bac}.choice input{accent-color:var(--navy);margin:4px 0 0;width:16px;height:16px;flex-shrink:0}.second-heading{margin-top:30px}.review-card{border:1px solid var(--line);border-radius:12px;background:#fafcfd;padding:22px}.review-name{display:block;font-size:1.25rem;margin:8px 0 20px;overflow-wrap:anywhere}.review-stat{display:flex;justify-content:space-between;gap:15px;padding:10px 0;font-size:.88rem;border-top:1px solid #e3e8ec}.review-note{font-size:.85rem;color:var(--muted)}.playing-preview{background:var(--soft);border-radius:12px;padding:22px;margin:25px 0}.playing-preview p{font-size:.9rem;color:var(--muted);margin-bottom:0}.step-actions{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:25px;margin-top:34px}.btn{border:1px solid var(--navy);border-radius:8px;background:var(--navy);color:white;padding:11px 18px;font-weight:700;font-size:.9rem;display:inline-block;text-decoration:none;text-align:center}.btn:hover{background:var(--navy2)}.btn.outline{background:white;color:var(--navy);border-color:#c7d2da}.btn.outline:hover{background:var(--soft)}.error{color:#a5292b;font-weight:650;font-size:.9rem}.result-card{max-width:900px;margin:35px auto;background:white;border:1px solid var(--line);border-radius:16px;padding:45px}.written-score{font-size:2.7rem;font-weight:750;color:var(--navy);margin:15px 0}.result-table{width:100%;border-collapse:collapse;margin:20px 0}.result-table th,.result-table td{text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}.result-table td:last-child,.result-table th:last-child{text-align:right}.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.save-note{font-size: @media(max-width:1100px){.test-layout{grid-template-columns:220px minmax(0,1fr);gap:25px}.test-content{padding:35px 30px}.recognition-grid{gap:12px}.symbol-row{grid-template-columns:150px minmax(0,1fr)}}
@media(max-width:800px){.test-layout{grid-template-columns:1fr;gap:18px;padding:0 18px;margin-top:20px}.sidebar{position:static;padding:17px}.sidebar-title,.sidebar-note{display:none}.score-split{margin:0 0 13px;font-size:.85rem}.section-nav{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.section-nav button{text-align:center;padding:10px 5px;font-size:.72rem;line-height:1.25}.section-nav button span{display:block;margin:0 0 4px}.test-content{padding:26px}.result-card{margin:20px 18px;padding:28px}}
@media(max-width:520px){header{padding:12px 17px;gap:12px}.brand{font-size:.85rem;gap:9px}.brand-mark{width:31px;height:31px;font-size:23px;flex-shrink:0}.home-link{font-size:.72rem}.test-content{padding:22px 17px}.recognition-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.builder-grid{grid-template-columns:1fr}.symbol-row{grid-template-columns:1fr;gap:6px}.string-inputs{gap:5px}.string-inputs input{padding:9px 3px}.review-stat{font-size:.8rem}.section-nav button{font-size:.66rem;padding:9px 3px}.result-table{font-size:.85rem}}
@media print{header,footer,.sidebar,.step-actions,.result-actions{display:none}.result-card{margin:0;padding:0;border:0;max-width:none}.test-layout{display:block}.test-content{border:0;padding:0}.result-table{break-inside:avoid}}

<body>
<header><div class="brand"><span class="brand-mark" aria-hidden="true">G</span>Guitar Chord Benchmark</div><nav style="display:flex;gap:18px;flex-wrap:wrap"><a class="home-link" href="teacher/">Teacher results</a><a class="home-link" href="/">Classroom home</a></nav></header>
<main id="app"></main>
<footer>Gardner Classroom · Intro to Guitar</footer>
<script>
'use strict';
const CHORDS=[{name:'Small C',shape:'xxx010'},{name:'Small G',shape:'xxx003'},{name:'Small G7',shape:'xxx001'},{name:'Em',shape:'022000'},{name:'D',shape:'xx0232'},{name:'C',shape:'x32010'},{name:'G',shape:'320003'},{name:'A',shape:'x02220'},{name:'A7',shape:'x02020'},{name:'Am',shape:'x02210'},{name:'D7',shape:'xx0212'},{name:'E',shape:'022100'}];
const BUILD_CHORDS=['C','G','D','Am'];
const STRINGS=['E','A','D','G','B','E'];
const STRING_LABELS=['low E (6th)','A (5th)','D (4th)','G (3rd)','B (2nd)','high e (1st)'];
const SYMBOLS=[{label:'X above a string',choices:[['skip','Do not strum it'],['open','Play it open'],['press','Press a fret']]},{label:'O above a string',choices:[['open','Play it open'],['skip','Do not strum it'],['nut','The nut']]},{label:'Dot on a fret',choices:[['press','Press that string at that fret'],['open','Play it open'],['skip','Do not strum it']]},{label:'Thick line at the top',choices:[['nut','The nut before fret 1'],['press','A finger position'],['open','An open string']]}];
const KNOWLEDGE=[{prompt:'What is a chord?',options:['Three or more notes sounding together','One string played repeatedly','The wooden part of the guitar'],answer:0},{prompt:'For a full C chord, which string should you avoid strumming?',options:['Low E (6th)','G (3rd)','High e (1st)'],answer:0},{prompt:'What does a capo do?',options:['Shortens the strings to raise the pitch','Tunes each string separately','Mutes every string'],answer:0},{prompt:'What helps fretted notes ring clearly?',options:['Curled fingers and a relaxed wrist','A flat finger across every string','A tightly bent wrist'],answer:0}];
const APPLY=[{prompt:'In G | D | Em | C repeated, what comes after C?',options:['G','D','Am'],answer:0},{prompt:'Four measures with four downstrokes each contain how many strums?',options:['8','12','16'],answer:2},{prompt:'Which two chords have the same root letter?',options:['G and G7','G and D','Em and Am'],answer:0},{prompt:'When using a capo, where does fret 1 move?',options:['Just after the capo','Back to the nut','It disappears from the chart'],answer:0}];
const PLAYING=[{key:'position',label:'Playing position and fretting hand',max:3},{key:'C',label:'Clear C chord',max:2},{key:'G',label:'Clear G chord',max:2},{key:'D',label:'Clear D chord',max:2},{key:'Em',label:'Clear Em chord',max:2},{key:'Am',label:'Clear Am chord',max:2},{key:'G-D',label:'Change G to D',max:3},{key:'D-Em',label:'Change D to Em',max:3},{key:'Em-C',label:'Change Em to C',max:3},{key:'C-G',label:'Change C to G',max:3},{key:'pulse',label:'Steady four-beat strumming',max:5}];
const SECTIONS=['Strings & symbols','Name the chords','Build the chords','Chord knowledge','Review & submit'];
const POINTS=[14,24,16,16,0];
const SCORE_ROWS=[['strings','Open strings',6],['symbols','Diagram symbols',8],['names','Name the chords',24],['diagrams','Build the chords',16],['knowledge','Playing chords',8],['apply','Put it together',8]];
const API='https://api.gardnerclassroom.com/api';
let sending=false,submitError='';
const STORAGE_KEY='gardner-guitar-benchmark-v2';
const EMPTY_ANSWERS=()=>({strings:Array(6).fill(''),symbols:Array(4).fill(''),names:Array(12).fill(''),diagrams:Object.fromEntries(BUILD_CHORDS.map(name=>[name,Array(6).fill('')])),knowledge:Array(4).fill(''),apply:Array(4).fill('')});
function shuffle(values){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function choiceOrders(){return{symbols:SYMBOLS.map(q=>shuffle(q.choices.map((_,i)=>i))),names:shuffle(CHORDS.map(q=>q.name)),knowledge:KNOWLEDGE.map(q=>shuffle(q.options.map((_,i)=>i))),apply:APPLY.map(q=>shuffle(q.options.map((_,i)=>i)))}}
function validAnswers(a){return a&&['strings','symbols','names','knowledge','apply'].every(k=>Array.isArray(a[k])&&a[k].length===({strings:6,symbols:4,names:12,knowledge:4,apply:4})[k]&&a[k].every(v=>typeof v==='string'&&v.length<60))&&BUILD_CHORDS.every(k=>Array.isArray(a.diagrams?.[k])&&a.diagrams[k].length===6&&a.diagrams[k].every(v=>['','x','o','1','2','3','4'].includes(v)))}
function grade(a){const sections={strings:a.strings.reduce((sum,v,i)=>sum+Number(v.trim().toUpperCase()===STRINGS[i]),0),symbols:a.symbols.reduce((sum,v,i)=>sum+(v===['skip','open','press','nut'][i]?2:0),0),names:a.names.reduce((sum,v,i)=>sum+(v===CHORDS[i].name?2:0),0),diagrams:0,knowledge:a.knowledge.reduce((sum,v,i)=>sum+(v===String(KNOWLEDGE[i].answer)?2:0),0),apply:a.apply.reduce((sum,v,i)=>sum+(v===String(APPLY[i].answer)?2:0),0)};for(const name of BUILD_CHORDS){const values=a.diagrams[name],shape=CHORDS.find(c=>c.name===name).shape.split('');if(name==='G'&&values.join('')==='32oo33'){sections.diagrams+=4;continue}if(shape.every((v,i)=>!['x','0'].includes(v)||values[i]===(v==='0'?'o':'x')))sections.diagrams++;for(let i=0;i<6;i++)if(!['x','0'].includes(shape[i])&&values[i]===shape[i])sections.diagrams++}return{sections,total:Object.values(sections).reduce((sum,v)=>sum+v,0)}}
function unanswered(){return[...state.answers.strings,...state.answers.symbols,...state.answers.names,...state.answers.knowledge,...state.answers.apply,...BUILD_CHORDS.flatMap(c=>state.answers.diagrams[c])].filter(v=>!v).length}
function esc(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let state={name:'',answers:EMPTY_ANSWERS(),section:0,orders:choiceOrders(),result:null,submissionId:null};
try{const saved=JSON.parse(sessionStorage.getItem(STORAGE_KEY));if(saved&&validAnswers(saved.answers)&&typeof saved.name==='string'&&saved.name.length<=80){state={...state,name:saved.name,answers:saved.answers,section:Number.isInteger(saved.section)&&saved.section>=0&&saved.section<5?saved.section:0,orders:saved.orders||state.orders,result:saved.result?.id?saved.result:null,submissionId:saved.submissionId||null}}}catch{}
function save(){try{sessionStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{}}
function chordSVG(shape){let content='';'EADGBe'.split('').forEach((s,i)=>{const x=22+i*22;content+=`<text x="${x}" y="13" text-anchor="middle">${s}</text><line x1="${x}" x2="${x}" y1="32" y2="140" class="fret-line"/>`});content+='<line x1="22" x2="132" y1="32" y2="32" class="nut-line"/>';for(let f=1;f<=4;f++)content+=`<line x1="22" x2="132" y1="${32+f*27}" y2="${32+f*27}" class="fret-line"/>`;shape.split('').forEach((v,i)=>{const x=22+i*22;content+=['x','0'].includes(v)?`<text x="${x}" y="27" text-anchor="middle" class="string-mark">${v==='x'?'×':'○'}</text>`:`<circle cx="${x}" cy="${32+(Number(v)-.5)*27}" r="7" fill="currentColor"/>`});const words=shape.split('').map((v,i)=>`${STRING_LABELS[i]}: ${v==='x'?'muted':v==='0'?'open':'fret '+v}`).join('; ');return `<svg class="chord-picture" viewBox="0 0 154 158" role="img" aria-label="Chord diagram. ${esc(words)}">${content}</svg>`}
function options(list,current,placeholder){return`<option value="">${placeholder}</option>`+list.map(([value,label])=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`).join('')}
function section0(){return`<h1 tabindex="-1">Strings & symbols</h1><p class="intro">Start with your name. Then show how you read a chord diagram.</p><label class="name-label" for="student-name">Your first and last name</label><input class="text-input" id="student-name" autocomplete="name" maxlength="80" placeholder="First Last" value="${esc(state.name)}"><section class="question-section"><div class="section-heading"><h2>1. Name the open strings</h2><span>6 points</span></div><p>Write them from lowest sounding (6th) to highest sounding (1st).</p><div class="string-inputs">${['6th','5th','4th','3rd','2nd','1st'].map((s,i)=>`<label>${s}<input class="text-input" data-field="strings" data-index="${i}" maxlength="1" aria-label="${s} string name" autocapitalize="characters" autocomplete="off" value="${esc(state.answers.strings[i])}"></label>`).join('')}</div></section><section class="question-section"><div class="section-heading"><h2>2. Read the symbols</h2><span>8 points</span></div><p>Choose the meaning of each mark in a chord diagram.</p><div class="symbol-list">${SYMBOLS.map((q,i)=>`<div class="symbol-row"><label for="symbol-${i}"><strong>${q.label}</strong></label><select id="symbol-${i}" data-field="symbols" data-index="${i}">${options(state.orders.symbols[i].map(j=>q.choices[j]),state.answers.symbols[i],'Choose meaning')}</select></div>`).join('')}</div></section>`}
function section1(){return`<h1 tabindex="-1">Name the chords</h1><p class="intro">Look at the dots and the X/O markings. Choose a name for each diagram.</p><div class="recognition-grid">${CHORDS.map((chord,i)=>`<div class="recognition-card"><span class="question-number">${i+3}</span>${chordSVG(chord.shape)}<label class="sr-only" for="chord-${i}">Chord diagram ${i+1} name</label><select id="chord-${i}" data-field="names" data-index="${i}">${options(state.orders.names.map(n=>[n,n]),state.answers.names[i],'Name chord')}</select></div>`).join('')}</div>`}
function builder(name,index){const value=state.answers.diagrams[name];return`<div><span class="question-number">${index+15}</span><div class="builder-card"><h3>${name}</h3><p>Tap X, O, or a fret on each string.</p><div class="diagram-grid" role="group" aria-label="Build ${name} chord">${'EADGBe'.split('').map(s=>`<span class="builder-string">${s}</span>`).join('')}${value.map((v,i)=>`<button type="button" class="mark-button ${['x','o'].includes(v)?'active':''}" data-chord="${name}" data-string="${i}" data-mark="true" aria-label="${name} ${STRING_LABELS[i]} string: cycle X and O. ${v==='x'?'Muted':v==='o'?'Open':'No X or O selected'}">${v==='x'?'X':v==='o'?'O':'·'}</button>`).join('')}${[1,2,3,4].flatMap(f=>value.map((v,i)=>`<button type="button" class="fret-button ${v===String(f)?'active':''}" data-chord="${name}" data-string="${i}" data-fret="${f}" aria-label="${name}, ${STRING_LABELS[i]} string, fret ${f}" aria-pressed="${v===String(f)}">${v===String(f)?'●':''}</button>`)).join('')}</div><div class="fret-caption">frets 1 → 4</div><div class="builder-actions"><span class="selection-summary" aria-live="polite">${value.filter(Boolean).length} of 6 strings set</span><button type="button" class="clear-builder" data-clear="${name}">Clear ${name}</button></div></div></div>`}
function section2(){return`<h1 tabindex="-1">Build the chords</h1><p class="intro">Place X or O above every open or muted string, then tap each finger’s fret. Use the full C and G shapes. Tap a selected fret again to clear it.</p><div class="builder-grid">${BUILD_CHORDS.map(builder).join('')}</div>`}
function choiceQuestion(q,i,field,number){return`<fieldset class="choice-question" style="border-left:0;border-right:0;border-top:0;padding-left:0;padding-right:0"><legend class="sr-only">${number}. ${esc(q.prompt)}</legend><h3 aria-hidden="true">${number}. ${esc(q.prompt)}</h3><div class="choice-group">${state.orders[field][i].map(j=>`<label class="choice"><input type="radio" name="${field}-${i}" data-field="${field}" data-index="${i}" value="${j}" ${state.answers[field][i]===String(j)?'checked':''}><span>${esc(q.options[j])}</span></label>`).join('')}</div></fieldset>`}
function section3(){return`<h1 tabindex="-1">Chord knowledge</h1><p class="intro">Apply what you know about chord playing and progressions.</p><div class="section-heading"><h2>Playing chords</h2><span>8 points</span></div>${KNOWLEDGE.map((q,i)=>choiceQuestion(q,i,'knowledge',i+19)).join('')}<div class="section-heading second-heading"><h2>Put it together</h2><span>8 points</span></div>${APPLY.map((q,i)=>choiceQuestion(q,i,'apply',i+23)).join('')}`}
function section4(){return`<h1 tabindex="-1">Review & submit</h1><p class="intro">Check your name and any unanswered items before finishing your work.</p><div class="review-card"><span class="eyebrow">Student</span><strong class="review-name">${esc(state.name)||'Name missing'}</strong><div class="review-stat"><span>Knowledge questions</span><b>70 points</b></div><div class="review-stat"><span>Playing check with teacher</span><b>30 points</b></div><div class="review-stat"><span>Unanswered selections</span><b>${unanswered()}</b></div></div><p class="review-note">Unanswered items receive zero. You can return to any section before finishing.</p><div class="playing-preview"><h2>Playing check after submission</h2><p>Play C, G, D, Em, and Am once each. Then play G | D | Em | C twice, with four steady downstrokes per measure. Your teacher will score position, chord sound, changes, and pulse.</p></div><p class="save-note">Submit to save your name and answers for Mr. Gardner. Your answers stay in this tab if the connection fails.</p><button type="button" class="btn" id="finish" ${state.name.trim().length<2||sending?'disabled':''}>${sending?'Saving…':'Submit written benchmark'}</button>${submitError?'<p class="error" role="alert">'+esc(submitError)+'</p>':''}${state.name.trim().length<2?'<p class="error" role="alert">Enter your first and last name in Strings & symbols.</p>':''}`}
function render(focusHeading=false){const app=document.getElementById('app');if(state.result){renderResult();return}app.innerHTML=`<div class="test-layout"><aside class="sidebar"><div class="sidebar-title eyebrow">Your test</div><div class="score-split"><span><b>70</b> knowledge</span><span><b>30</b> playing</span></div><nav class="section-nav" aria-label="Test sections">${SECTIONS.map((s,i)=>`<button type="button" data-section="${i}" ${state.section===i?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${s}</button>`).join('')}</nav><div class="sidebar-note">The playing check is scored by your teacher after you finish.</div></aside><article class="test-content"><div class="step-top"><span class="eyebrow">Section ${state.section+1} of 5</span><span class="step-points">${POINTS[state.section]} points</span></div>${[section0,section1,section2,section3,section4][state.section]()}<div class="step-actions"><button type="button" class="btn outline" data-section="${state.section-1}" ${state.section===0?'disabled':''}>Back</button>${state.section<4?`<button type="button" class="btn" data-section="${state.section+1}">Next section</button>`:''}</div></article></div>`;if(focusHeading)app.querySelector('h1').focus({preventScroll:true})}
function renderResult(){const result=state.result;document.getElementById('app').innerHTML=`<section class="result-card"><span class="eyebrow">Written benchmark complete</span><h1 tabindex="-1">Your result, ${esc(state.name.split(' ')[0])}.</h1><div class="written-score">${result.score.total} / 70</div><p>Knowledge points · The 30-point playing check is scored separately by Mr. Gardner.</p><table class="result-table"><thead><tr><th scope="col">Section</th><th scope="col">Points</th></tr></thead><tbody>${SCORE_ROWS.map(([key,label,max])=>`<tr><th scope="row">${label}</th><td>${result.score.sections[key]} / ${max}</td></tr>`).join('')}</tbody></table><p class="save-note">Saved to Mr. Gardner’s private teacher dashboard. You can also download a copy of your answers and score.</p><p class="save-note">Submission receipt: ${esc(result.id)}</p><p class="save-note">Completed: ${esc(new Date(result.completedAt).toLocaleString())}</p><div class="result-actions"><button class="btn" type="button" id="download">Download answers & score</button><button class="btn outline" type="button" id="print">Print result</button><button class="btn outline" type="button" id="review-answers">Review my answers</button><button class="btn outline" type="button" id="new-test">Start a new test</button></div></section>`}
function downloadResult(){const record={benchmark:'Guitar Chord Benchmark',version:2,submissionId:state.result.id,studentName:state.name,completedAt:state.result.completedAt,knowledgePoints:state.result.score.total,knowledgeMax:70,playingPoints:null,playingMax:30,sectionScores:state.result.score.sections,answers:state.answers,playingRubric:PLAYING};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guitar-benchmark-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('app').addEventListener('input',event=>{const target=event.target;if(target.id==='student-name'){state.name=target.value;save();return}if(target.dataset.field&&target.type!=='radio'){state.answers[target.dataset.field][Number(target.dataset.index)]=target.value;save()}});
document.getElementById('app').addEventListener('change',event=>{const target=event.target;if(target.dataset.field){state.answers[target.dataset.field][Number(target.dataset.index)]=target.value;save()}});
document.getElementById('app').addEventListener('click',async event=>{const button=event.target.closest('button');if(!button||button.disabled||sending)return;if(button.dataset.section!==undefined){state.section=Number(button.dataset.section);save();render(true);window.scrollTo({top:0,behavior:'smooth'});return}if(button.dataset.chord){const name=button.dataset.chord,index=Number(button.dataset.string),current=state.answers.diagrams[name][index];state.answers.diagrams[name][index]=button.dataset.mark?(current==='x'?'o':current==='o'?'':'x'):(current===button.dataset.fret?'':button.dataset.fret);const focusSelector=button.dataset.mark?`button[data-chord="${name}"][data-string="${index}"][data-mark]`:`button[data-chord="${name}"][data-string="${index}"][data-fret="${button.dataset.fret}"]`;save();render();document.querySelector(focusSelector).focus({preventScroll:true});return}if(button.dataset.clear){state.answers.diagrams[button.dataset.clear]=Array(6).fill('');save();render();document.querySelector(`button[data-clear="${button.dataset.clear}"]`).focus({preventScroll:true});return}if(button.id==='finish'){if(sending)return;sending=true;submitError='';state.submissionId=state.submissionId||crypto.randomUUID();save();render();try{const response=await fetch(API+'/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.submissionId,name:state.name,answers:state.answers}),signal:AbortSignal.timeout(20000)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to save. Please try again.');state.result=result;save();render();document.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}catch(error){submitError=error.name==='TypeError'||error.name==='TimeoutError'?'Could not reach the results server. Keep this tab open and try submitting again.':error.message;render()}finally{sending=false;if(!state.result)render()}return}if(button.id==='download')downloadResult();if(button.id==='print')window.print();if(button.id==='review-answers'){state.result=null;state.submissionId=null;state.section=0;save();render(true)}if(button.id==='new-test'&&window.confirm('Start a new test? Download your current result first if you need a copy.')){state={name:'',answers:EMPTY_ANSWERS(),section:0,orders:choiceOrders(),result:null,submissionId:null};save();render(true)}});
render();
</script>
</body>
